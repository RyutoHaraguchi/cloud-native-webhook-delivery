version: "2"
linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        core-is-cloud-agnostic:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/aws
              desc: core から AWS に依存しない。internal/adapters/aws に置く
            - pkg: cloud.google.com/go
              desc: core から GCP に依存しない。internal/adapters に置く
            - pkg: github.com/RyutoHaraguchi/cloud-native-webhook-delivery/internal/adapters
              desc: core から adapters に依存しない
formatters:
  enable:
    - gofmt