include classpath("application.conf")

# キューの URL を、リクエストを受けたホスト名で作る。
# ホストからは localhost:9324、コンテナからは elasticmq:9324 で同じキューに届く
node-address {
  host = "*"
}

aws {
  region = ap-northeast-1
  accountId = 000000000000
}

# 値は docs/architecture.md の「キューの設定」に合わせる。
# 保持期間（7 日、14 日）は設定できないので省く。ElasticMQ は Fair Queue も再現しない
queues {
  deliveries {
    defaultVisibilityTimeout = 90 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "deliveries-dlq"
      maxReceiveCount = 20
    }
  }
  deliveries-dlq {}
}
