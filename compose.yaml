# ローカル開発用。DynamoDB Local と ElasticMQ はメモリだけで動くので、down で中身が消える。
# ここにある値はすべてローカル専用のダミーで、秘密ではない。
# 認証情報とリージョンはダミー値で、どちらのエミュレーターも検証しない。

# 複数のサービスで共有するローカル専用のダミー値。delivery-worker を足すときも同じアンカーを使う
x-local:
  # 署名シークレット。dummy-receiver の検証とシードの登録で同じ値を使う
  signing-secret: &signing_secret whsec_zzkm2psYYWpTxux7UT7UNBCgkXfTLjwoxYQgPLIQHzI=
  # ローカル用 SecretCipher（AES-256-GCM）の鍵。openssl rand -base64 32 で作ったローカル専用のダミー
  secret-key: &secret_key RLIn+XJQY7BZ4CjVduujLUn4EeXNW7lZTM7BLfUZUN4=

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # テーブルを作って終了する。DynamoDB Local の起動を待つ処理はスクリプト側にある
  dynamodb-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      - dynamodb
    entrypoint: ["/bin/bash", "/init/init-dynamodb.sh"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    volumes:
      - ./local/init-dynamodb.sh:/init/init-dynamodb.sh:ro
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

  # 署名を検証し、クエリで指定した応答を返す。使い方は cmd/dummy-receiver/main.go
  dummy-receiver:
    build:
      context: .
      args:
        SERVICE: dummy-receiver
    environment:
      SIGNING_SECRETS: *signing_secret
    ports:
      - "8080:8080"

  # config テーブルに t_local のエンドポイントを書いて終了する。書く内容は cmd/local-seed/endpoints.go と docs/architecture.md の「ローカルのシード」
  seed:
    build:
      context: .
      args:
        SERVICE: local-seed
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      CONFIG_TABLE: config
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      LOCAL_SECRET_KEY: *secret_key
      SEED_SIGNING_SECRET: *signing_secret
    restart: "no"
