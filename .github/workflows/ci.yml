name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 週に一度すべてのジョブを走らせる。主な目的は、コードを変えなくても公開される新しい脆弱性を
  # govulncheck で拾うことと、配布元のタグが動いていないかを lockfile ジョブで確かめること。
  # 公開リポジトリでは、60 日間リポジトリに動きがないと GitHub が schedule を無効にする
  schedule:
    # 毎時 0 分は混み合い、遅延や job の破棄が起きやすいのでずらす
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # schedule の実行は main への push と同じ refs/heads/main を共有するので、取り消すのは PR の実行だけにする
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          # mise 本体も Dependabot と同じく、公開から 7 日経った版だけを使う
          minimum_release_age: 7d
          install_args: go
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          minimum_release_age: 7d
          install_args: go golangci-lint
      - run: golangci-lint run

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          minimum_release_age: 7d
          install_args: go
      - run: go tool govulncheck ./...

  # actions.lock が workflow と一致し、記録したコミットが本物の配布元から辿れることを確かめる
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify
